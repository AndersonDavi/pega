# Compila, prueba y publica un .zip con los tres ejecutables al crear una etiqueta v*
# (git tag v0.1.0 && git push origin v0.1.0). También se puede lanzar a mano.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Compilar
        run: cargo build --release

      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/pega.exe, target/release/pega-cli.exe, target/release/pega-ocr.exe, README.md, LICENSE dist/
          Compress-Archive dist/* pega-windows-x64.zip
          (Get-FileHash pega-windows-x64.zip -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii pega-windows-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: pega-windows-x64
          path: |
            pega-windows-x64.zip
            pega-windows-x64.zip.sha256

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pega-windows-x64.zip
            pega-windows-x64.zip.sha256
