[package]
name = "pega"
version = "0.1.0-beta.1"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.34", default-features = false, features = ["accesskit", "clipboard"] }
egui_software_backend = { path = "vendor/egui_software_backend" }
png = "0.18.1"
qrcodegen = "1.8.0"
rusqlite = { version = "0.41.0", features = ["bundled", "serialize"] }
windows = { version = "0.62.2", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Globalization", "Security_Cryptography", "Foundation_Collections"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_Registry", "Win32_UI_Controls_Dialogs", "Win32_Globalization", "Win32_System_SystemInformation", "Win32_System_ProcessStatus"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
