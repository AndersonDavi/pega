[package]
name = "pega"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.34", default-features = false, features = ["clipboard"] }
egui_software_backend = "0.0.3"
png = "0.18.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
